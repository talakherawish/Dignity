# Deploys the site when main moves.
#
# There is no build step here on purpose: `/usr/local/bin/deploy` on the Oracle
# box pulls from GitHub and builds both halves there, so the frontend picks up
# VITE_PAYLOAD_URL from the server's own .env rather than from whatever machine
# happened to run the build. Duplicating the build here would prove nothing the
# server does not prove a minute later.
#
# What is checked here is what the server's build would let through. Both
# halves are typechecked and the website is linted, because a broken typecheck
# does not stop a Vite build: an error sat in src/lib/search.ts for months, and
# 87 formatting errors sat across four files, because nothing ever ran either
# command. The bilingual field rules are checked too -- a collection whose
# English/Arabic pairing has quietly changed still compiles, still builds and
# still deploys, it just stops behaving the way the admin panel is documented
# to behave, and the first person to find out is an editor who cannot save
# something. That script had itself been failing for months before anyone ran
# it.
#
# The backend is not linted: `npm run lint` there crashes inside its own
# ESLint config ("property 'react' closes the circle") before it reaches any
# source file. Adding it would block every deploy on a broken config rather
# than on a real problem. Worth fixing, then adding here.
name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# One deploy at a time. The server builds in place and swaps the frontend
# directory at the end; two runs overlapping would fight over it. Queued rather
# than cancelled, so the last push always ends up being the one that ships.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A failure in any step here stops the deploy: the site on the box stays
  # exactly as it was.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @tanstack/react-start and its siblings declare
          # `node >= 22.12.0`, so `npm ci` at the root fails outright on 20.
          # Pinning 20 here -- the backend's engines floor -- blocked a deploy
          # on the install step the first time these checks ran. 22 satisfies
          # both halves. The floor is on the root package.json now too, so the
          # next person sees it without reading a dependency tree.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dignity-backend/package-lock.json

      # `npm install`, not `npm ci`, and not by preference: **neither
      # package-lock.json currently satisfies `npm ci`.** Both halves fail its
      # sync check from a clean checkout --
      #
      #   root:    Missing @emnapi/core, @emnapi/runtime, lru-cache (npm 10;
      #            npm 11 happens to accept it)
      #   backend: Missing yjs, monaco-editor, @testing-library/dom and ~10
      #            more, plus an Invalid picomatch -- under *every* npm tested
      #
      # -- so the first run of these checks died on the install step before
      # reaching a single line of source. `npm install` reconciles and
      # installs; verified from a clean directory on npm 10, the version Node
      # 22 ships, before being put here.
      #
      # Repairing the lockfiles is the real fix, and it is deliberately not
      # done here: regenerating the backend's re-resolves ~900 packages that
      # the production server builds from, which is a decision to take
      # knowingly rather than as part of a CI change. Until then the cost is
      # bounded -- this job typechecks and lints, it does not build the
      # artifact that ships. The server builds that from its own tree.
      #
      # The backend needs its full tree, not just tsx: the collections import
      # real code (hooks, the singleton helpers), not only types.
      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: dignity-backend
        run: npm install --no-audit --no-fund

      - name: Typecheck the website
        run: npm run typecheck

      - name: Lint the website
        run: npm run lint

      - name: Typecheck the backend
        working-directory: dignity-backend
        run: npm run typecheck

      - name: Check the bilingual field rules
        working-directory: dignity-backend
        run: npx tsx scripts/verify-bilingual.ts

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run the server's deploy script over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The box's public IP. If the university ever maps a domain to it,
          # this is the one line to change.
          DEPLOY_HOST: 84.13.77.162
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            "opc@$DEPLOY_HOST" '/usr/local/bin/deploy'
